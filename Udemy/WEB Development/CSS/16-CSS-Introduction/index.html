<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Introduction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 style="color: crimson;">Inline style</h1>
    <p class="internal">This paragraph uses an internal style.</p>
    <p class="external">This paragraph and the page heading also use style.css.</p>
    <style>
        .internal {
            color: darkgreen;
            font-size: 20px;
        }
    </style>

</body>

</html>
