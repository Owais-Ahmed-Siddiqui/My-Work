<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Properties Part 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Wrapping and Overflow</h1>
    <p class="wrap">This paragraph wraps normally when it reaches the edge of its box.</p>
    <p class="no-wrap">This long line stays on one line and can scroll sideways in its box.</p>
    <p class="clip">This text is deliberately clipped at the edge of the box.</p>
    <p class="break">averyveryveryverylongwordthatneedstobreak</p>

</body>

</html>
