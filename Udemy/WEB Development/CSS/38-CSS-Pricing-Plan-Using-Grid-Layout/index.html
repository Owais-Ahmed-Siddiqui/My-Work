<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans with Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Choose a Plan</h1>
    <main class="plans">
        <section class="card">
            <h2>Basic</h2>
            <p class="price">$5 / month</p>
            <p>For getting started</p>
            <ul>
                <li>One project</li>
                <li>Email support</li>
            </ul><button>Choose Basic</button>
        </section>
        <section class="card featured">
            <h2>Standard</h2>
            <p class="price">$12 / month</p>
            <p>For regular practice</p>
            <ul>
                <li>Five projects</li>
                <li>Priority support</li>
            </ul><button>Choose Standard</button>
        </section>
        <section class="card">
            <h2>Plus</h2>
            <p class="price">$20 / month</p>
            <p>For bigger projects</p>
            <ul>
                <li>Unlimited projects</li>
                <li>Extra storage</li>
            </ul><button>Choose Plus</button>
        </section>
    </main>

</body>

</html>
