<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Ways to Write Colors</h1>
    <p class="named">Named color</p>
    <p class="hex">Hexadecimal color</p>
    <p class="rgb">RGB color</p>
    <p class="rgba">RGBA with transparency</p>
    <p class="hsl">HSL color</p>
    <p class="hsla">HSLA with transparency</p>

</body>

</html>
