<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Properties</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Text Properties</h1>
    <p class="center">Centered text</p>
    <p class="underline">Underlined text</p>
    <p class="upper">this text becomes uppercase</p>
    <p class="indent">This paragraph starts with an indent. Text properties can change how a block of writing looks.</p>
    <p class="spaced">Words with extra spacing</p>

</body>

</html>
