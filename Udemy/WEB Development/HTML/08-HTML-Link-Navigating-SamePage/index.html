<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Same-Page Links</title>
</head>

<body>

    <h1 id="top">A Page With Sections</h1>
    <nav><a href="#books">Books</a> | <a href="#music">Music</a> | <a href="#bottom">Bottom</a></nav>
    <h2 id="books">Books</h2>
    <p>I like reading stories and learning new things.</p>
    <h2 id="music">Music</h2>
    <p>This is another section on the same page.</p>
    <p>Scroll down to try the bottom link.</p>
    <p>Practice line one.</p>
    <p>Practice line two.</p>
    <h2 id="bottom">Bottom of the page</h2><a href="#top">Back to top</a>

</body>

</html>
