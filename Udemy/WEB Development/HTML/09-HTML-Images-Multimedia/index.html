<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Images and Multimedia</title>
</head>

<body>

    <h1>Images and Media</h1>
    <p>The image has alternative text and a set size.</p>
    <img src="https://placehold.co/240x140/png" alt="A simple placeholder landscape" width="240" height="140">
    <h2>Audio</h2>
    <audio controls src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3">Your browser does
        not support audio.</audio>
    <h2>Video</h2>
    <video controls width="320" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">Your
        browser does not support video.</video>

</body>

</html>
