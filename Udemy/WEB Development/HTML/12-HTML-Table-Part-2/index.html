<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Table Part 2</title>
</head>

<body>

    <h1>Table Sections</h1>
    <table border="1">
        <caption>My Weekly Study Time</caption>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Hours</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTML</td>
                <td>3</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>4</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>7</th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
