<!DOCTYPE html>

    <title>HTML Lists</title>
</head>
<body>

<h1>Lists</h1>
<h2>Unordered list</h2><ul><li>Apples</li><li>Bananas<ul><li>Green bananas</li><li>Ripe bananas</li></ul></li><li>Oranges</li></ul>
<h2>Ordered list</h2><ol><li>Open the editor</li><li>Write HTML</li><li>Open it in a browser</li></ol>
<h2>Description list</h2><dl><dt>HTML</dt><dd>Describes page content.</dd><dt>CSS</dt><dd>Styles page content.</dd></dl>

</body>
</html>
