<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Paragraph and Text Formatting</title>
</head>

<body>

    <h1>Text Formatting</h1>
    <p>This is a paragraph. A line break is useful here:<br>the next words start on a new line.</p>
    <hr>
    <p><b>Bold text</b> and <strong>important text</strong>.</p>
    <p><i>Italic text</i> and <em>emphasized text</em>.</p>
    <p><mark>Marked text</mark>, <small>small text</small>, and <del>deleted text</del>.</p>
    <p>Water is H<sub>2</sub>O. Two squared is 2<sup>2</sup>.</p>

</body>

</html>
