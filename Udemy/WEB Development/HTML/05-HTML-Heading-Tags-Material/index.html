<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Heading Tags</title>
</head>

<body>

    <h1>Main page heading</h1>
    <h2>Section heading</h2>
    <h3>Topic in this section</h3>
    <h4>A smaller topic</h4>
    <h5>A detail</h5>
    <h6>The smallest heading</h6>
    <p>Use headings in order to show the structure of the page.</p>

</body>

</html>
