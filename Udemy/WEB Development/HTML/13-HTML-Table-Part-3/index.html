<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Table Part 3</title>
</head>

<body>

    <h1>Spanning Table Cells</h1>
    <table border="1">
        <caption>Class Schedule</caption>
        <tr>
            <th>Day</th>
            <th>9:00</th>
            <th>10:00</th>
        </tr>
        <tr>
            <th>Monday</th>
            <td colspan="2">HTML practice</td>
        </tr>
        <tr>
            <th rowspan="2">Tuesday</th>
            <td>Reading</td>
            <td>Writing</td>
        </tr>
        <tr>
            <td colspan="2">Project time</td>
        </tr>
    </table>

</body>

</html>
