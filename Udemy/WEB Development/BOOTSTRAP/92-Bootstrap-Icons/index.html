<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>92 - Bootstrap Icons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1><i class="bi bi-bootstrap-fill text-primary"></i> Bootstrap Icons</h1>
        <p><i class="bi bi-house-door text-success"></i> Home</p>
        <p><i class="bi bi-envelope text-danger"></i> Send me a message</p>
        <p><i class="bi bi-star-fill text-warning fs-3"></i> A larger star</p>
        <button class="btn btn-primary"><i class="bi bi-download"></i> Download</button>
        <button class="btn btn-outline-danger"><i class="bi bi-heart"></i> Favorite</button>
    </div>
</body>

</html>
