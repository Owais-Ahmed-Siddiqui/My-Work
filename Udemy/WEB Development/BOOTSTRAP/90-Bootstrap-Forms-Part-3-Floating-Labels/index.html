<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 - Floating Labels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Floating labels</h1>
        <p>Each control needs a matching label and an id.</p>
        <div class="form-floating mb-3"><input type="text" class="form-control" id="floatingName"
                placeholder="Your name"><label for="floatingName">Name</label></div>
        <div class="form-floating mb-3"><input type="password" class="form-control" id="floatingPassword"
                placeholder="Password"><label for="floatingPassword">Password</label></div>
        <div class="form-floating"><textarea class="form-control" placeholder="Write a note" id="floatingNote"
                style="height: 120px"></textarea><label for="floatingNote">Your note</label></div>
    </div>
</body>

</html>
