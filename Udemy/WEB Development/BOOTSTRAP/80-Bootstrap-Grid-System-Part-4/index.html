<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80 - Grid System Part 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Vertical alignment</h1>
        <div class="row align-items-start bg-light mb-3" style="height: 120px">
            <div class="col bg-primary text-white p-2">align-items-start</div>
            <div class="col bg-success text-white p-2">Top</div>
        </div>
        <div class="row align-items-center bg-light mb-3" style="height: 120px">
            <div class="col bg-primary text-white p-2">align-items-center</div>
            <div class="col bg-success text-white p-2">Middle</div>
        </div>
        <div class="row align-items-end bg-light mb-3" style="height: 120px">
            <div class="col bg-primary text-white p-2">align-items-end</div>
            <div class="col bg-success text-white p-2">Bottom</div>
        </div>
        <div class="row bg-light" style="height: 120px">
            <div class="col align-self-start bg-warning p-2">align-self-start</div>
            <div class="col align-self-center bg-info p-2">align-self-center</div>
            <div class="col align-self-end bg-danger text-white p-2">align-self-end</div>
        </div>
    </div>
</body>

</html>
