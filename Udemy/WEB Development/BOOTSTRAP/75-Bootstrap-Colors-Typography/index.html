<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75 - Colors and Typography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1 class="display-4 text-primary">Display heading</h1>
        <p class="lead">Lead text is a little larger than a normal paragraph.</p>
        <p class="text-success fw-bold">Green, bold text</p>
        <p class="text-danger fst-italic">Red, italic text</p>
        <p class="text-uppercase">This sentence uses uppercase text.</p>
        <p class="text-lowercase">THIS SENTENCE USES LOWERCASE TEXT.</p>
        <p class="text-center text-warning">Centered warning text</p>
        <p class="text-muted">Muted text is useful for less important details.</p>
        <div class="bg-dark text-white p-3">White text on a dark background</div>
    </div>
</body>

</html>
