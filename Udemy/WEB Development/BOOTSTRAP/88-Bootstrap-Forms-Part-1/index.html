<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>88 - Forms Part 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Basic form controls</h1>
        <form>
            <div class="mb-3"><label for="studentName" class="form-label">Name</label><input type="text"
                    class="form-control" id="studentName" placeholder="Your name"></div>
            <div class="mb-3"><label for="studentEmail" class="form-label">Email</label><input type="email"
                    class="form-control" id="studentEmail" placeholder="name@example.com"></div>
            <div class="mb-3"><label for="studentPassword" class="form-label">Password</label><input type="password"
                    class="form-control" id="studentPassword"></div>
            <div class="mb-3"><label for="studentMessage" class="form-label">Message</label><textarea
                    class="form-control" id="studentMessage" rows="3"></textarea></div>
            <label for="smallInput" class="form-label">Small input</label><input id="smallInput"
                class="form-control form-control-sm mb-3" placeholder="Small size">
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>
</body>

</html>
