<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>76 - Buttons and Button Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Buttons and button groups</h1>
        <div class="mb-3">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-danger">Danger</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-outline-primary">Outline</button>
            <button class="btn btn-primary btn-lg">Large</button>
            <button class="btn btn-secondary btn-sm">Small</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary active" aria-pressed="true">Active</button>
            <button class="btn btn-secondary" disabled>Disabled</button>
        </div>
        <div class="btn-group mb-3" role="group" aria-label="Fruit choices">
            <button class="btn btn-outline-success">Apple</button>
            <button class="btn btn-outline-success">Pear</button>
            <button class="btn btn-outline-success">Orange</button>
        </div>
        <div class="btn-group-vertical" role="group" aria-label="Vertical menu">
            <button class="btn btn-dark">First</button>
            <button class="btn btn-dark">Second</button>
        </div>
    </div>
</body>

</html>
