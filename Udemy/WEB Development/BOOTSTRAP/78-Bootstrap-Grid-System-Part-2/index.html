<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>78 - Grid System Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Responsive grid breakpoints</h1>
        <p>Resize the browser: these columns stack on narrow screens and share rows at their breakpoint.</p>
        <div class="row g-2">
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2">
                <div class="bg-primary text-white p-3">A: sm 6, md 4, lg 3, xl 2</div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2">
                <div class="bg-success text-white p-3">B: sm 6, md 4, lg 3, xl 2</div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2">
                <div class="bg-warning p-3">C: sm 6, md 4, lg 3, xl 2</div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2">
                <div class="bg-info p-3">D: sm 6, md 4, lg 3, xl 2</div>
            </div>
        </div>
    </div>
</body>

</html>
