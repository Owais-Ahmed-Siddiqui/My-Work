<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>81 - Spacing and Borders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Margins, padding, and borders</h1>
        <div class="bg-light m-3 p-3 border">This box uses <code>m-3</code>, <code>p-3</code>, and <code>border</code>.
        </div>
        <div class="bg-warning mt-3 mb-3 px-4 py-2 border border-primary rounded">Top and bottom margin, horizontal and
            vertical padding, a colored border, and rounded corners.</div>
        <div class="p-3 border border-success border-3 rounded-pill">A thicker green border with fully rounded ends.
        </div>
    </div>
