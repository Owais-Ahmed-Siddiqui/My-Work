<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91 - Dropdowns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Dropdown menus</h1>
        <div class="dropdown mb-3">
            <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">Choose a lesson</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#grid">Grid</a></li>
                <li><a class="dropdown-item" href="#cards">Cards</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="#forms">Forms</a></li>
            </ul>
        </div>
        <div class="dropdown-center"><button class="btn btn-outline-success dropdown-toggle" type="button"
                data-bs-toggle="dropdown" aria-expanded="false">Centered menu</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#one">One</a></li>
                <li><a class="dropdown-item" href="#two">Two</a></li>
            </ul>
        </div>
        <p class="mt-3">Click a button to open its menu. Click outside or choose an item to close it.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
