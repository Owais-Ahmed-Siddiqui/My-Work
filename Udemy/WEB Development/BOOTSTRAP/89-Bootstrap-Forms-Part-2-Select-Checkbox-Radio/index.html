<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>89 - Forms Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Select, checkbox, and radio</h1>
        <div class="mb-3"><label for="favoriteColor" class="form-label">Favorite color</label><select
                class="form-select" id="favoriteColor">
                <option selected>Choose one...</option>
                <option>Blue</option>
                <option>Green</option>
            </select></div>
        <div class="mb-3"><label for="topics" class="form-label">Choose multiple topics</label><select
                class="form-select" id="topics" multiple size="3">
                <option>Grid</option>
                <option>Cards</option>
                <option>Forms</option>
            </select></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" value="" id="practice"><label
                class="form-check-label" for="practice">I practised today</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="level" id="beginner" checked><label
                class="form-check-label" for="beginner">Beginner</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="level" id="intermediate"><label
                class="form-check-label" for="intermediate">Intermediate</label></div>
        <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" role="switch"
                id="reminders"><label class="form-check-label" for="reminders">Turn on reminders</label></div>
    </div>
</body>

</html>
