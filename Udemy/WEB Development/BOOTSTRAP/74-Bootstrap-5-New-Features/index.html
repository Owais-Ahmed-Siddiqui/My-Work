<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>74 - Bootstrap 5 New Features</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1 class="text-center">Bootstrap 5 features</h1>
        <p>Bootstrap 5 does not require jQuery. Its interactive components use the Bootstrap JavaScript bundle.</p>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="bg-primary text-white p-3">The <code>g-3</code> class adds gutters between columns.</div>
            </div>
            <div class="col-md-6">
                <div class="bg-success text-white p-3">Use <code>ms-3</code> for a logical start margin.</div>
            </div>
        </div>
        <div class="border p-3" dir="rtl">
            <p class="mb-2">This box reads right to left. The page uses the Bootstrap RTL stylesheet.</p>
            <button class="btn btn-outline-primary">RTL example</button>
        </div>
    </div>
</body>

</html>
