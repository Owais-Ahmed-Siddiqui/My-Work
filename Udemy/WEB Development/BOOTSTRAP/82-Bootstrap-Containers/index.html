<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>82 - Containers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container bg-primary text-white py-3 mb-3">
        <h1>.container</h1>
        <p class="mb-0">This responsive container has a different maximum width at each breakpoint.</p>
    </div>
    <div class="container-fluid bg-success text-white py-3 mb-3">
        <h2>.container-fluid</h2>
        <p class="mb-0">This container spans the full width of the screen.</p>
    </div>
    <div class="container-sm bg-warning py-3 mb-3">container-sm: full width until the small breakpoint</div>
    <div class="container-md bg-info py-3">container-md: full width until the medium breakpoint</div>
</body>

</html>
