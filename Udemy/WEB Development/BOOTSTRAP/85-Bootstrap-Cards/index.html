<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>85 - Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Bootstrap cards</h1>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">My first card</div>
                    <div class="card-body">
                        <h2 class="card-title h5">A small garden</h2>
                        <p class="card-text">Cards group a heading, text, and button in one simple box.</p>
                        <a href="#garden" class="btn btn-success">See the garden</a>
                    </div>
                    <div class="card-footer text-muted">Updated today</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <img src="https://placehold.co/600x240?text=Bootstrap+Card" class="card-img-top"
                        alt="A sample placeholder for a card image">
                    <div class="card-body">
                        <h2 class="card-title h5">A card with an image</h2>
                        <p class="card-text">The image sits above the card body.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
