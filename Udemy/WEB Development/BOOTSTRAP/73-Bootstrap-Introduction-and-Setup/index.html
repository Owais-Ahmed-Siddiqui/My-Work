<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>73 - Bootstrap Introduction and Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1 class="text-primary text-center">Hello Bootstrap</h1>
        <p class="text-success">Bootstrap is a CSS framework with ready-to-use styles and responsive layout classes.</p>
        <!-- A container keeps this content centered with space on wide screens. -->
        <div class="container bg-light p-3">
            <h2>My first example</h2>
            <p class="mb-0">The <code>text-primary</code>, <code>bg-light</code>, and <code>p-3</code> classes come from
                Bootstrap.</p>
        </div>
        <button class="btn btn-primary mt-3">A Bootstrap button</button>
    </div>
</body>

</html>
