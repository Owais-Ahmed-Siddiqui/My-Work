<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>86 - Accordions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Accordion</h1>
        <div class="accordion" id="lessonAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#answerOne" aria-expanded="true" aria-controls="answerOne">What is
                        Bootstrap?</button></h2>
                <div id="answerOne" class="accordion-collapse collapse show" data-bs-parent="#lessonAccordion">
                    <div class="accordion-body">Bootstrap is a toolkit for building responsive web pages.</div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#answerTwo" aria-expanded="false"
                        aria-controls="answerTwo">What does an accordion do?</button></h2>
                <div id="answerTwo" class="accordion-collapse collapse" data-bs-parent="#lessonAccordion">
                    <div class="accordion-body">It lets a reader show or hide sections of content.</div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#answerThree" aria-expanded="false"
                        aria-controls="answerThree">Does Bootstrap 5 need jQuery?</button></h2>
                <div id="answerThree" class="accordion-collapse collapse" data-bs-parent="#lessonAccordion">
                    <div class="accordion-body">No. The Bootstrap JavaScript bundle handles this example.</div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
