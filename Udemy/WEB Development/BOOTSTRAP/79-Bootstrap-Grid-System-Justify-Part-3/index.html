<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>79 - Grid Justify Part 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Horizontal alignment</h1>
        <p>Each row has three columns. Try the different justify-content classes.</p>
        <div class="row justify-content-start bg-light mb-3">
            <div class="col-3 bg-primary text-white p-3">start</div>
        </div>
        <div class="row justify-content-center bg-light mb-3">
            <div class="col-3 bg-success text-white p-3">center</div>
        </div>
        <div class="row justify-content-end bg-light mb-3">
            <div class="col-3 bg-warning p-3">end</div>
        </div>
        <div class="row justify-content-between bg-light mb-3">
            <div class="col-3 bg-info p-3">between</div>
            <div class="col-3 bg-info p-3">between</div>
        </div>
        <div class="row justify-content-around bg-light">
            <div class="col-3 bg-secondary text-white p-3">around</div>
            <div class="col-3 bg-secondary text-white p-3">around</div>
        </div>
    </div>
</body>

</html>
