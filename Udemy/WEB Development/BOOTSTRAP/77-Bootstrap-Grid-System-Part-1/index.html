<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>77 - Grid System Part 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>Rows and columns</h1>
        <!-- A row contains columns. Bootstrap's grid is based on 12 columns. -->
        <div class="row mb-3">
            <div class="col bg-primary text-white p-3">Equal column</div>
            <div class="col bg-success text-white p-3">Equal column</div>
            <div class="col bg-warning p-3">Equal column</div>
        </div>
        <div class="row">
            <div class="col-4 bg-info p-3">4 of 12 columns</div>
            <div class="col-8 bg-secondary text-white p-3">8 of 12 columns</div>
        </div>
    </div>
</body>

</html>
