<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>87 - List Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h1>List groups</h1>
        <ul class="list-group mb-4">
            <li class="list-group-item active" aria-current="true">Current lesson</li>
            <li class="list-group-item">Practice grid classes</li>
            <li class="list-group-item disabled" aria-disabled="true">Completed (disabled example)</li>
        </ul>
        <div class="list-group mb-4">
            <a href="#colors"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">Colors
                <span class="badge bg-primary rounded-pill">3</span></a>
            <a href="#forms" class="list-group-item list-group-item-action">Forms</a>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">Flush item one</li>
            <li class="list-group-item">Flush item two</li>
        </ul>
    </div>
</body>

</html>
